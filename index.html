<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Simples em JS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Gerenciador de usuarios</h1>

    <form id="form">
      <input type="hidden" id="editIndex" value="-1">
      
      <div class="form-nome">
        <label for="nome">Nome</label>
        <input type="text" id="nome" required placeholder="Digite o nome">
      </div>

      <div class="form-email">
        <label for="email">E-mail</label>
        <input type="text" id="email" required placeholder="Digite o e-mail">
      </div>

      <button type="submit" id="btnSalvar">Adicionar</button>
      <button type="button" id="btnCancelar" style="display: none;">Cancelar</button>
    </form>

    <h2>Lista de usuarios</h2>
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Acoes</th>
        </tr>
      </thead>
      <tbody id="tabelaCorpo"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
